:root{color-scheme:light dark;--bg:light-dark(#ebe1cf,#15100c);--ink:light-dark(#2b1e14,#efe5d4);--mut:light-dark(#6d5a48,#b3a28c);--card:light-dark(#f7f1e6,#211912);--line:light-dark(#d6c6ab,#3a2d22);--brass:#c39a3e;--wal:#3a2616;--lt:#ecd8b4;--dk:#a9784e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip}
.top{max-width:1120px;margin:0 auto;padding:22px max(4vw,16px) 6px}
h1{font-size:clamp(28px,4.2vw,40px);line-height:1.05;margin:0 0 6px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.top p{margin:0;color:var(--mut);max-width:62ch}
.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,340px);gap:clamp(18px,3vw,36px);max-width:1120px;margin:0 auto;padding:16px max(4vw,16px) 40px;align-items:start}
.stage{width:min(100%,680px,calc(100svh - 150px));min-width:280px;justify-self:center}
.frame{position:relative;background:linear-gradient(160deg,#4a311c,var(--wal) 60%,#2a1b0f);padding:clamp(6px,1.4vw,14px);border-radius:12px;box-shadow:0 22px 44px -20px #000a,inset 0 1px 0 #7a5634}
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;container-type:inline-size;outline:2px solid var(--brass);border-radius:2px;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.sq{appearance:none;border:0;margin:0;padding:0;position:relative;display:grid;place-items:center;cursor:pointer;aspect-ratio:1;font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.sq:focus-visible{outline:3px solid #2f6fd6;outline-offset:-3px;z-index:2}
.l{background:var(--lt)}.d{background:var(--dk)}
.last{background-image:linear-gradient(#d9a62c80,#d9a62c80)}
.sel{background-image:linear-gradient(#e0b23cb8,#e0b23cb8)}
.hint{box-shadow:inset 0 0 0 4px #2f6fd6}
.chk{background-image:radial-gradient(circle,#e2402a 0,#e2402acc 30%,#e2402a00 70%)}
.pc{font-family:Pieces,'Noto Sans Symbols 2','Segoe UI Symbol','Apple Symbols','DejaVu Sans',sans-serif;font-size:10.2cqw;line-height:1;position:relative;z-index:1;pointer-events:none;transform:translateY(.03em)}
.pw{color:#fffaf0;text-shadow:-1px 0 #24170d,1px 0 #24170d,0 1px #24170d,0 -1px #24170d,0 3px 4px #0005}
.pb{color:#20150c;text-shadow:0 1px 0 #ffffff40,0 3px 4px #0004}
.pop{animation:pop .2s ease-out}@keyframes pop{from{transform:translateY(.03em) scale(.82);opacity:.5}}
.dot::before{content:'';position:absolute;width:30%;height:30%;border-radius:50%;background:#2b1e1447}
.ring::before{content:'';position:absolute;inset:5%;border-radius:50%;border:max(3px,.9cqw) solid #2b1e1447}
.co{position:absolute;font:600 2.3cqw/1 Archivo,sans-serif;pointer-events:none}
.l .co{color:var(--dk)}.d .co{color:var(--lt)}
.co.f{right:5%;bottom:4%}.co.r{left:5%;top:5%}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;margin-top:12px;align-items:baseline}
#status{font-weight:800;font-size:20px}
#status.think::after{content:'';display:inline-block;width:8px;height:8px;margin-left:8px;border-radius:50%;background:var(--brass);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
.cap{color:var(--mut);font-size:15px;font-family:Pieces,'Noto Sans Symbols 2',Archivo,sans-serif;white-space:nowrap}
.promo{position:absolute;inset:0;display:grid;place-items:center;background:#000a;border-radius:12px;z-index:5}
.promo[hidden]{display:none}
.promo div{display:flex;gap:10px;background:var(--card);padding:14px;border-radius:12px;box-shadow:0 10px 30px #0008}
.promo button{width:clamp(56px,13vw,76px);height:clamp(56px,13vw,76px);border-radius:10px;border:1px solid var(--line);background:var(--lt);cursor:pointer;font-size:clamp(40px,9vw,54px);display:grid;place-items:center;padding:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:16px;margin:0 0 8px;font-weight:600}
.panel{display:grid;gap:18px}
.levels{display:grid;gap:6px}
.lv,.seg button,.btn{appearance:none;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;min-height:44px;cursor:pointer;padding:6px 12px}
.lv{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px}
.lv small{color:var(--mut);font-size:13px;white-space:nowrap}
.lv[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#24170d;font-weight:600}
.lv[aria-pressed=true] small{color:#3b2a12}
.note{color:var(--mut);font-size:14px;margin:8px 0 0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:8px}
.seg.modes{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:12px}
.seg.modes button{font-weight:600;line-height:1.2}
#helpNote:empty{display:none}
.panel section[hidden]{display:none}
.btn.primary{width:100%;background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.btn:disabled{opacity:.45;cursor:default}
:is(.lv,.btn,.seg button):focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.moves{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;font-variant-numeric:tabular-nums;border-top:1px solid var(--line)}
.moves li{display:grid;grid-template-columns:2.6em 1fr 1fr;padding:5px 2px;border-bottom:1px solid var(--line)}
.moves li span:first-child{color:var(--mut)}
.moves .now{font-weight:800}
.empty{color:var(--mut);font-size:14px;padding:8px 2px}
@media(max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.stage{width:min(100%,620px)}.panel{max-width:620px;width:100%;justify-self:center}}
@media(prefers-reduced-motion:reduce){.pop,#status.think::after{animation:none}}
</style>
</head>
<body>
<header class="top">
<h1>Chess, at your level</h1>
<p>An engine tuned to play like a person: it makes believable mistakes at lower levels and gets sharper as you climb. Tap a piece, then tap where it should go.</p>
</header>
<main class="wrap">
<section class="stage">
<div class="seg modes" id="mode"><button data-m="play">Play vs this engine</button><button data-m="help">Help me vs another opponent</button></div>
<div class="frame"><div id="board" class="board" role="grid" aria-label="Chess board"></div>
<div id="promo" class="promo" hidden><div id="promoBox"></div></div></div>
<div class="bar"><span id="status" aria-live="polite">Your move</span><span id="cap" class="cap"></span></div>
<p id="helpNote" class="note"></p>
</section>
<aside class="panel">
<section id="levelsSec"><h2>Opponent strength</h2><div id="levels" class="levels"></div>
<p class="note">Ratings are rough guides. You can change level mid-game.</p></section>
<section><h2>Play as</h2>
<div class="seg" id="side"><button data-v="w">White</button><button data-v="b">Black</button><button data-v="r">Random</button></div>
<button id="new" class="btn primary">Start new game</button>
<div class="row"><button id="undo" class="btn">Take back</button><button id="hintB" class="btn">Hint</button><button id="flip" class="btn">Flip</button></div></section>
<section><h2>Moves</h2><ol id="moves" class="moves"></ol></section>
</aside>
</main>

 for(const t of'qrbnp'){const lw=init[t]-cnt[t.toUpperCase()],lb=init[t]-cnt[t];byB+=GL[t].repeat(Math.max(0,lw));byW+=GL[t].repeat(Math.max(0,lb));dif+=(lb-lw)*vv[t]}
 const mine=pw?byW:byB,theirs=pw?byB:byW,adv=pw?dif:-dif;
 $('cap').textContent=(mine||theirs)?`You took ${mine||'–'}  ·  Engine took ${theirs||'–'}${adv?`  (${adv>0?'+':''}${adv})`:''}`:'';
 $('levels').innerHTML=LV.map((l,i)=>`<button class="lv" data-l="${i}" aria-pressed="${i==level}"><span>${l[0]}</span><small>${l[1]}</small></button>`).join('');
 for(const b of $('side').children)b.setAttribute('aria-pressed',b.dataset.v==side);
 let ml='';for(let i=0;i<moves.length;i+=2){const nw=i>=moves.length-2;ml+=`<li class="${nw?'now':''}"><span>${i/2+1}.</span><span>${moves[i].san}</span><span>${moves[i+1]?moves[i+1].san:''}</span></li>`}
 $('moves').innerHTML=ml||'<li class="empty">No moves yet. White moves first.</li>';$('moves').scrollTop=1e5;
 $('undo').disabled=mode=='help'?!moves.length:!moves.some((x,i)=>(i%2==0)==pw);$('hintB').disabled=thinking||!!over||G.w!=pw;
}

$('board').addEventListener('click',e=>{const b=e.target.closest('.sq');if(!b||!canMove())return;const s=+b.dataset.s,p=G.b[s];
 if(sel>=0){let c=G.legal().filter(m=>m.f==sel&&m.t==s);
  // castling by tapping king, then its own rook
  if(!c.length&&lower(G.b[sel]||'')=='k'&&p&&lower(p)=='r'&&isW(p)==G.w)c=G.legal().filter(m=>m.k&&m.f==sel&&m.k==((s&7)==7?1:2));
  if(c.length==1){play(c[0]);return}
  if(c.length>1){showPromo(c);return}}
 sel=(p&&isW(p)==G.w&&s!=sel)?s:-1;render()});
$('mode').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.m==mode)return;cancel();mode=b.dataset.m;hint=null;hintS='';sel=-1;save();render();next()});
function showPromo(c){const box=$('promoBox');box.innerHTML=c.map((m,i)=>`<button data-i="${i}" aria-label="Promote to ${({q:'queen',r:'rook',b:'bishop',n:'knight'})[lower(m.pr)]}">${glyph(m.pr)}</button>`).join('');
 $('promo').hidden=false;box.onclick=e=>{const b=e.target.closest('button');if(!b)return;$('promo').hidden=true;play(c[+b.dataset.i])}}
$('promo').addEventListener('click',e=>{if(e.target.id=='promo'){$('promo').hidden=true;sel=-1;render()}});
$('levels').addEventListener('click',e=>{const b=e.target.closest('.lv');if(!b)return;level=+b.dataset.l;save();render()});
$('side').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;side=b.dataset.v;save();render()});
$('new').addEventListener('click',()=>{reset();pw=side=='r'?Math.random()<.5:side=='w';flip=false;save();render();next()});
$('flip').addEventListener('click',()=>{flip=!flip;render()});
$('undo').addEventListener('click',()=>{if(!moves.length)return;cancel();
 do{const x=moves.pop();G.unmake(x.m);keys.pop()}while(mode=='play'&&moves.length&&G.w!=pw);
 sel=-1;hint=null;hintS='';over=outcome();save();render();next()});
$('hintB').addEventListener('click',()=>{if(thinking||over||G.w!=pw)return;autoHint()});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){$('promo').hidden=true;sel=-1;render()}});

// restore
reset();
try{const s=JSON.parse(localStorage.getItem('chess-at-level')||'null');
 if(s){pw=!!s.pw;side=s.side||'w';level=s.level??2;mode=s.mode=='help'?'help':'play';for(const u of s.u||[]){const m=G.legal().find(x=>uci(x)==u);if(!m)break;const sn=san(m,G.legal());G.make(m);moves.push({m,san:sn});keys.push(G.key())}over=outcome()}}catch(e){reset()}
render();next();
}
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
